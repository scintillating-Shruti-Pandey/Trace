[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-mmi"
version = "0.1.0"
description = "Trace manufacturing evidence corpus and retrieval foundations"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<3",
  "pydantic-settings>=2.5,<3", "alembic>=1.13,<2", "psycopg[binary]>=3.2,<4",
  "arq>=0.26,<1", "boto3>=1.35,<2", "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
trace = "app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
